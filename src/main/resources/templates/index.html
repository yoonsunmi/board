<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('게시판')}"></head>
<body>

<header th:replace="~{fragments/common :: header}"></header>

<main class="container">
    <section class="board">

        <div class="board-head">
            <h1>게시글 목록</h1>
        </div>

        <!-- 목록 -->
        <table class="board-table">
            <thead>
            <tr>
                <th scope="col" class="col-num hide-sm">번호</th>
                <th scope="col">제목</th>
                <th scope="col" class="col-writer">작성자</th>
                <th scope="col" class="col-actions">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="board : ${boardList}">
                <td class="muted hide-sm" th:text="${board.id}">1</td>
                <td class="title">
                    <a th:href="@{/board/{id}(id=${board.id})}" th:text="${board.title}" href="#">게시글입니다.</a>
                </td>
                <td th:text="${board.writer}">홍길동</td>
                <td>
                    <div class="row-actions">
                        <a class="btn btn-sm" th:href="@{/board/{id}/edit(id=${board.id})}">수정</a>
                        <button type="button" class="btn btn-sm btn-danger" data-action="delete"
                                th:data-url="@{/board/{id}(id=${board.id})}">삭제</button>
                    </div>
                </td>
            </tr>
            <tr th:if="${boardList == null or boardList.isEmpty()}">
                <td colspan="4" class="empty">등록된 게시글이 없습니다.</td>
            </tr>
            </tbody>
        </table>

        <div class="board-foot">
            <a class="btn btn-primary" th:href="@{/board/write}" href="write.html">글쓰기</a>
        </div>

        <nav class="pagination" th:if="${boardList != null and boardList.totalPages > 0}">
            <a th:href="@{/board/list(page=${boardList.number - 1})}"
               th:classappend="${boardList.first} ? 'disabled'" href="#">&lsaquo;</a>
            <a th:each="i : ${#numbers.sequence(startPage, endPage)}"
               th:href="@{/board/list(page=${i})}"
               th:text="${i + 1}"
               th:class="${i == boardList.number} ? 'active'" href="#" class="active">1</a>
            <a th:href="@{/board/list(page=${boardList.number + 1})}"
               th:classappend="${boardList.last} ? 'disabled'" href="#">&rsaquo;</a>
        </nav>

    </section>
</main>

<script>
    $(document).on('click', '[data-action="delete"]', function () {
        if (!confirm('삭제하시겠습니까?')) return;

        $.ajax({
            url: $(this).data('url'),
            type: 'DELETE',
            success: function () {
                location.reload();
            },
            error: function () {
                alert('삭제 실패');
            }
        });
    });
</script>
</body>
</html>
